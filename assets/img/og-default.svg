      <stop offset="0" stop-color="#0f2861"/>
      <stop offset="1" stop-color="#2952b8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="260" fill="#ffffff" opacity=".05"/>
  <circle cx="140" cy="560" r="200" fill="#a8bdea" opacity=".08"/>

  <!-- ticket -->
  <g transform="translate(90,150)">
    <rect x="0" y="0" width="1020" height="300" rx="26" fill="#ffffff"/>
    <path d="M760 0v300" stroke="#c9d1dc" stroke-width="3" stroke-dasharray="10 9"/>
    <circle cx="760" cy="0" r="22" fill="#0f2861"/>
    <circle cx="760" cy="300" r="22" fill="#0f2861"/>

    <text x="52" y="72" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#77828f" letter-spacing="4">FLIGHT RESERVATION &#183; VISA PURPOSES</text>
    <text x="52" y="152" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="66" font-weight="700" fill="#111827" letter-spacing="-2">Visa Flight Tickets</text>
