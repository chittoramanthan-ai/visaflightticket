    </g>

    <!-- stub -->
    <text x="890" y="120" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="30" font-weight="700" fill="#111827" letter-spacing="6">PNR</text>
    <text x="890" y="168" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="40" font-weight="700" fill="#193b92" letter-spacing="4">K7QX2M</text>
    <g fill="#111827" opacity=".8">
      <rect x="812" y="200" width="4" height="56"/><rect x="822" y="200" width="2" height="56"/>
      <rect x="830" y="200" width="6" height="56"/><rect x="842" y="200" width="2" height="56"/>
      <rect x="850" y="200" width="4" height="56"/><rect x="860" y="200" width="7" height="56"/>
      <rect x="873" y="200" width="2" height="56"/><rect x="881" y="200" width="5" height="56"/>
      <rect x="892" y="200" width="3" height="56"/><rect x="901" y="200" width="6" height="56"/>
      <rect x="913" y="200" width="2" height="56"/><rect x="921" y="200" width="4" height="56"/>
      <rect x="931" y="200" width="7" height="56"/><rect x="944" y="200" width="2" height="56"/>
      <rect x="952" y="200" width="5" height="56"/>
    </g>
